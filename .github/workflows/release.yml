name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Verify build
        run: go build -v ./...

      - name: Run tests
        run: go test -v ./...

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## TOON Go Package Release

            This is a community fork providing a Go implementation of the TOON specification.

            **Module**: `github.com/soy4rias/toongo`

            ### Installation
            ```bash
            go get github.com/soy4rias/toongo@${{ github.ref_name }}
            ```

            > **Note**: This package is not affiliated with the original TOON creators.
            > See the [original TypeScript implementation](https://github.com/toon-format/toon) for the reference implementation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
